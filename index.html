<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOBTI Work Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBhwLaO4tYfoVsV8vSXiTopmKH5TcpkvzU",
      authDomain: "dobti-6560c.firebaseapp.com",
      projectId: "dobti-6560c",
      storageBucket: "dobti-6560c.firebasestorage.app",
      messagingSenderId: "835699682423",
      appId: "1:835699682423:web:10abccfec342f134a4aa72",
      measurementId: "G-TNMRJHJZQX"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const docRef = db.collection("dobti").doc("unidade-saude");

    const estrutura = {
      "1. Introdução": [
        "1.1. Enquadramento",
        "1.2. Descrição da unidade hospitalar",
        "1.3. Contextualização do problema",
        "1.4. Objetivos"
      ],
      "2. Arquitetura Empresarial": [
        "2.1. Referencial TOGAF e a sua aplicabilidade à saúde",
        "2.2. Gestão de Processos de Negócio (BPM)",
        "2.3. Impacto e benefícios da adoção da arquitetura empresarial"
      ],
      "3. Desenvolvimento da Arquitetura": [
        "3.1. Fase Preliminar",
        "3.2. Fase A – Visão da Arquitetura",
        "3.3. Fase B – Arquitetura de Negócio",
        "3.4. Fase C – Arquitetura dos Sistemas de Informação",
        "3.5. Fase D – Arquitetura Tecnológica",
        "3.6. Fase E – Oportunidades e Soluções"
      ],
      "4. Conclusão": [
        "Sumário dos benefícios, limitações e caminhos futuros"
      ],
      "5. Referências Bibliográficas": [
        "Normas APA (7.ª edição), fontes académicas e técnicas"
      ],
      "6. Anexos": [
        "6.1. Questionário de satisfação",
        "6.2. Diagramas BPMN",
        "6.3. Mapeamento de dados e aplicações",
        "6.4. Matriz RACI e instrumentos de apoio"
      ]
    };

    let cachedData = {};

    function renderTable(section, items, data) {
      let html = `<div class="phase-card"><div class="phase-title">${section}</div><table><tr><th>Tópico</th><th>Responsável</th><th>Prazo</th><th>Status</th><th>Notas</th></tr>`;
      items.forEach((item, idx) => {
        const key = `${section}-${idx}`;
        const row = data[key] || { assigned: '', deadline: '', status: 'To Do', notes: '' };
        html += `<tr>
          <td>${item}</td>
          <td><input value="${row.assigned}" onchange="update('${key}', 'assigned', this.value)" /></td>
          <td><input type="date" value="${row.deadline}" onchange="update('${key}', 'deadline', this.value)" /></td>
          <td>
            <select onchange="update('${key}', 'status', this.value)">
              <option${row.status === 'To Do' ? ' selected' : ''}>To Do</option>
              <option${row.status === 'In Progress' ? ' selected' : ''}>In Progress</option>
              <option${row.status === 'Done' ? ' selected' : ''}>Done</option>
            </select>
          </td>
          <td><textarea onchange="update('${key}', 'notes', this.value)">${row.notes}</textarea></td>
        </tr>`;
      });
      html += '</table></div>';
      return html;
    }

    function update(key, field, value) {
      cachedData[key] = { ...cachedData[key], [field]: value };
      docRef.set(cachedData);
      updateProgressBar();
    }

    function updateProgressBar() {
      const total = Object.entries(estrutura).reduce((sum, [_, items]) => sum + items.length, 0);
      const done = Object.entries(cachedData).filter(([, v]) => v.status === 'Done').length;
      const percent = Math.round((done / total) * 100);
      document.getElementById('progress-bar').style.width = `${percent}%`;
    }

    function renderAll(data) {
      cachedData = data;
      const container = document.getElementById('tracker');
      container.innerHTML = Object.entries(estrutura).map(([section, items]) => renderTable(section, items, data)).join('');
      updateProgressBar();
    }

    docRef.onSnapshot((docSnap) => {
      if (docSnap.exists) {
        renderAll(docSnap.data());
      } else {
        docRef.set({});
      }
    });
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f9fafb; color: #111827; padding: 20px; }
    h1 { text-align: center; font-size: 2.2rem; color: #1f2937; margin-bottom: 20px; }
    .phase-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
    .phase-title { font-size: 1.25rem; font-weight: 600; color: #374151; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    th { background: #f3f4f6; text-align: left; color: #6b7280; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; font: inherit; font-size: 0.85rem; }
    textarea { resize: vertical; }
    .footer { text-align: center; margin-top: 50px; padding: 15px; font-size: 0.9rem; color: #6b7280; }
    .footer span { color: #1d4ed8; font-weight: 500; }
    #progress-container { width: 100%; background: #e5e7eb; border-radius: 10px; height: 20px; margin: 20px 0; overflow: hidden; }
    #progress-bar { height: 100%; background: #3b82f6; width: 0%; transition: width 0.3s ease-in-out; }
  </style>
</head>
<body>
  <h1>DOBTI - Unidade de Saúde Hospitalar</h1>
  <div id="progress-container"><div id="progress-bar"></div></div>
  <div id="tracker"></div>
  <div class="footer">Criado por <span>Renato Lopes</span></div>
</body>
</html>
